<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Term Binder</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Term Binder">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f3f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12141a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
button,a,input,textarea{touch-action:manipulation}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: left binder tabs (sections + classes) beside one working page. Each block type owns one hue, used the same way in the calendar, the week view and every class page. */
:root{
  --paper:#f2f3f7; --card:#ffffff; --ink:#1b2030; --mute:#586074; --line:#dcdfe8; --soft:#e9ebf2;
  --good:#1f8a5b; --warn:#b36b00; --bad:#c62828;
  --checkin:#e67c73; --apps:#3f51b5; --nespresso:#f4511e; --pub:#8e24aa; --portfolio:#2e9e6b;
  --skills:#0288d1; --studio:#f6bf26; --review:#d50000; --workout:#f691b2; --setup:#e67c73;
  --display:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;
  --body:'Hanken Grotesk','Helvetica Neue',Arial,sans-serif;
  --mono:'Neue Haas Grotesk Text Pro','Neue Haas Grotesk Text','Neue Haas Grotesk Display Pro','Neue Haas Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12141a; --card:#1a1d27; --ink:#e9ebf2; --mute:#9aa1b4; --line:#2b3040; --soft:#232736;
    --good:#4cc38a; --warn:#e5a63c; --bad:#ff7b7b;
    --checkin:#f0968d; --apps:#8c9eff; --nespresso:#ff8a65; --pub:#ce93d8; --portfolio:#5fd3a0;
    --skills:#4fc3f7; --studio:#ffd54f; --review:#ff6b6b; --workout:#f8a9c4; --setup:#f0968d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#12141a; --card:#1a1d27; --ink:#e9ebf2; --mute:#9aa1b4; --line:#2b3040; --soft:#232736;
  --good:#4cc38a; --warn:#e5a63c; --bad:#ff7b7b;
  --checkin:#f0968d; --apps:#8c9eff; --nespresso:#ff8a65; --pub:#ce93d8; --portfolio:#5fd3a0;
  --skills:#4fc3f7; --studio:#ffd54f; --review:#ff6b6b; --workout:#f8a9c4; --setup:#f0968d;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.shell{max-width:1320px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
h1,h2,h3{font-family:var(--display);letter-spacing:-0.015em;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:30px;font-weight:700}
h2{font-size:22px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* block type hues */
.t-checkin{--c:var(--checkin);--m:62%}.t-apps{--c:var(--apps);--m:68%}.t-nespresso{--c:var(--nespresso);--m:60%}
.t-pub{--c:var(--pub);--m:68%}.t-portfolio{--c:var(--portfolio);--m:62%}.t-skills{--c:var(--skills);--m:62%}
.t-studio{--c:var(--studio);--m:42%}.t-review{--c:var(--review);--m:66%}.t-workout{--c:var(--workout);--m:48%}.t-setup{--c:var(--setup);--m:62%}
.t-none{--c:var(--mute);--m:70%}
.tint{background:color-mix(in srgb,var(--c) 14%,var(--card));color:color-mix(in srgb,var(--c) var(--m),var(--ink));border:1px solid color-mix(in srgb,var(--c) 34%,transparent)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-bottom:18px}
.top .sub{color:var(--mute);margin-top:6px}
.pulse{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chipbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px}
.chipbtn[aria-pressed="true"],.chipbtn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.status{font-family:var(--mono);font-size:12px;color:var(--mute)}

.frame{display:grid;grid-template-columns:224px minmax(0,1fr);gap:28px;align-items:start}
.tabs{display:flex;flex-direction:column;gap:2px;position:sticky;top:12px}
.tabs .grp{margin:16px 0 6px 10px}
.tabs .grp:first-child{margin-top:0}
.tabs a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--mute);font-weight:500}
.tabs a:hover{background:var(--soft);color:var(--ink)}
.tabs a.on{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:6px 9px}
.tabs .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--mute)}
main{min-width:0;display:flex;flex-direction:column;gap:20px}

/* surfaces */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel > .label{display:block;margin-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.cols > *{min-width:0}
.muted{color:var(--mute)}
.pagehead{border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:10px}
.pagehead h1{color:color-mix(in srgb,var(--c) var(--m),var(--ink))}
.pagehead p{max-width:62ch;color:var(--ink)}
.prog{height:6px;border-radius:99px;background:color-mix(in srgb,var(--c) 18%,var(--card));overflow:hidden;max-width:320px}
.prog i{display:block;height:100%;background:var(--c)}

/* week */
.weekpick{display:flex;flex-wrap:wrap;gap:6px}
.weekgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.day{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.day{align-content:start}
.day.today{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.day .dh{display:flex;flex-direction:column;gap:2px}
.day .dow{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.day .dnum{font-family:var(--display);font-size:26px;font-weight:700;line-height:1}
.day .items{display:flex;flex-direction:column;gap:6px;min-width:0}
.blk{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:8px;text-decoration:none;min-width:0}
.blk strong{font-weight:600;display:flex;align-items:center;gap:8px;overflow-wrap:anywhere}
.blk .time{font-family:var(--mono);font-size:11.5px;opacity:.9}
a.blk:hover{filter:brightness(.97)}
.blk.flex{opacity:.62;border-style:dashed}
.due{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border:1px dashed var(--line);border-radius:8px;font-size:13px;color:var(--ink)}
.due .dia{width:9px;height:9px;background:var(--c);transform:rotate(45deg);margin-top:5px;flex:none}
.due.done{color:var(--mute);text-decoration:line-through}
.empty{color:var(--mute);font-size:13px;padding:6px 2px}
@media (min-width:1180px){
  .weekgrid{grid-template-columns:repeat(5,minmax(0,1fr))}
  .day{grid-template-columns:minmax(0,1fr)}
  .day .dh{flex-direction:row;align-items:baseline;gap:8px}
}
.big{display:flex;align-items:center;gap:12px}
.big b{font-family:var(--display);font-size:44px;line-height:1;min-width:2ch;text-align:center}
.step{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:18px;line-height:1}
.step:hover{background:var(--soft)}
.note{border-radius:10px;padding:10px 12px;background:var(--soft);font-size:14px}
.note b{font-weight:600}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:11px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item input[type=checkbox]{width:18px;height:18px;margin:2px 0 0;accent-color:var(--c,var(--ink))}
.item .t{font-weight:600}
.item.done .t{color:var(--mute);text-decoration:line-through}
.item .d{color:var(--mute);font-size:13.5px}
.when{font-family:var(--mono);font-size:12px;text-align:right;white-space:nowrap}
.pill{display:inline-block;font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute);margin-top:4px}
.pill.over{color:var(--bad);border-color:currentColor}.pill.today{color:var(--warn);border-color:currentColor}.pill.soon{color:var(--ink);border-color:var(--ink)}.pill.ok{color:var(--good);border-color:currentColor}
.proj{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--mute)}
.x{border:0;background:none;color:var(--mute);font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}
.x:hover{background:var(--soft);color:var(--ink)}
.grouph{margin:6px 0 0;display:flex;justify-content:space-between;align-items:baseline}

/* forms */
input[type=text],input[type=date],input[type=url],textarea{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{resize:vertical;min-height:90px;line-height:1.55}
.lined{background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 23px,var(--line) 23px,var(--line) 24px);background-color:var(--card);line-height:24px;padding-block:6px}
.form{display:flex;flex-wrap:wrap;gap:8px}
.form input[type=text]{flex:1 1 180px;width:auto}
.form input[type=date]{flex:0 1 150px;width:auto}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:8px;padding:8px 14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btnlink{display:inline-flex;text-decoration:none}
.sessions{display:flex;flex-wrap:wrap;gap:6px}
.sess{border:1px solid color-mix(in srgb,var(--c) 40%,transparent);background:transparent;border-radius:8px;padding:5px 9px;font-family:var(--mono);font-size:12px}
.sess[aria-pressed="true"]{background:var(--c);color:var(--card);border-color:var(--c)}
.linkrow{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)}
.linkrow:first-child{border-top:0}
.linkrow a{overflow-wrap:anywhere}

/* day shape */
.shape{display:flex;flex-direction:column;gap:4px}
.srow{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:stretch}
.srow .tm{font-family:var(--mono);font-size:12px;color:var(--mute);padding-top:9px;white-space:nowrap}
.srow .bar{border-radius:8px;padding:8px 12px;display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0}
.srow .bar span{font-size:13.5px}
.bar.plain{background:var(--soft);color:var(--ink)}
.bar.slide{background:repeating-linear-gradient(135deg,transparent 0 8px,var(--soft) 8px 16px);border:1px dashed var(--line);color:var(--mute)}
.table{width:100%;border-collapse:collapse}
.table th,.table td{text-align:left;padding:9px 8px;border-top:1px solid var(--line);vertical-align:top;font-size:14px}
.table th{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:400;border-top:0}
.scroll{overflow-x:auto}

/* rules */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;counter-reset:s}
.steps > div{background:var(--soft);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.steps > div::before{counter-increment:s;content:counter(s);font-family:var(--display);font-weight:700;font-size:26px;line-height:1}
.ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}

/* calendar overview */
.mini{display:grid;grid-template-columns:70px repeat(5,minmax(0,1fr));gap:6px;align-items:stretch}
.mini .wl{font-family:var(--mono);font-size:11px;color:var(--mute);display:flex;align-items:center}
.cell{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px;min-height:58px;display:flex;flex-direction:column;gap:5px;text-decoration:none;min-width:0}
.cell:hover{background:var(--soft)}
.cell .n{font-family:var(--mono);font-size:11px;color:var(--mute)}
.cell .dots{display:flex;flex-wrap:wrap;gap:3px}
.cell .dots i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.cell.off{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--soft) 6px 12px)}
.hd{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);text-align:center}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px}
.legend > div{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:10px}
.legend small{display:block;opacity:.85}

.foot{margin-top:8px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media (max-width:860px){
  input,textarea{font-size:16px}
  .frame{grid-template-columns:minmax(0,1fr);gap:16px}
  .tabs{flex-direction:row;overflow-x:auto;position:static;gap:4px;padding-bottom:6px;scrollbar-width:thin}
  .tabs .grp{display:none}
  .tabs a{white-space:nowrap;flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px}
  .tabs a.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .tabs a.on .sw{outline:1px solid var(--paper)}
  .tabs .cnt{display:none}
  h1{font-size:26px}
  .mini{grid-template-columns:44px repeat(5,minmax(0,1fr));gap:4px}
  .cell{padding:4px;min-height:48px}
  .srow{grid-template-columns:76px minmax(0,1fr);gap:8px}
}
@media (max-width:520px){
  .day{grid-template-columns:minmax(0,1fr)}
  .day .dh{flex-direction:row;align-items:baseline;gap:8px}
  .item{grid-template-columns:auto minmax(0,1fr)}
  .item .when{grid-column:2;text-align:left}
  .cell .dots i{width:8px;height:8px}
}
@media (prefers-reduced-motion:no-preference){ .blk,.cell,.tabs a{transition:background .15s,filter .15s} }
</style>

</head>
<body>
<div class="shell">
  <header class="top">
    <div>
      <div class="label">Fall term, Oct 26 to Dec 4, 2026</div>
      <h1>Term Binder</h1>
      <p class="sub" id="whereami"></p>
    </div>
    <div class="pulse" id="pulse"></div>
  </header>
  <div class="frame">
    <nav class="tabs" id="tabs" aria-label="Binder sections"></nav>
    <main id="main"></main>
  </div>
  <div class="foot"><span class="status" id="saved"></span><span class="status">Times are Eastern. Check-in at 9:15 sets the real shape of each day.</span></div>
</div>

<script>
(function(){
'use strict';

/* ---------- dates ---------- */
var STANDALONE=true, CAL_EMAIL='';
var TERM_START=new Date(2026,9,26), TERM_END=new Date(2026,11,4);
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);}
function mins(h,m){return h*60+(m||0);}
function tstr(m){var h=Math.floor(m/60),mm=m%60,ap=h>=12?'PM':'AM';var hh=h%12;if(hh===0)hh=12;return hh+':'+String(mm).padStart(2,'0')+' '+ap;}
function trange(s,e){var a=tstr(s),b=tstr(e);var ap1=a.slice(-2),ap2=b.slice(-2);return (ap1===ap2?a.slice(0,-3):a)+' to '+b;}
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function md(d){return MON[d.getMonth()]+' '+d.getDate();}
function dlong(d){return DOW[d.getDay()]+' '+md(d);}
function today(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function weekStart(i){return addDays(TERM_START,7*i);}
function weekOf(d){var i=Math.floor((d-TERM_START)/(7*864e5));return Math.max(0,Math.min(5,i));}
function uid(){return Math.random().toString(36).slice(2,9);}

/* ---------- block types ---------- */
var TYPES={
  checkin:{label:'Check-in',cal:'Flamingo',what:'10 minutes, Mon to Fri at 9:15. Name the day\'s appointments, errands and cooking, and the blocks re-seat around them.'},
  apps:{label:'Block A: Applications',cal:'Blueberry',what:'Mon to Fri, 9:30 to 12:00. Stage 1 outreach, then Stage 2 submissions.'},
  nespresso:{label:'Nespresso',cal:'Tangerine',what:'Block B on Monday and Wednesday, 1:00 to 4:00.'},
  pub:{label:'Publication',cal:'Grape',what:'Block B on Tuesday, 1:00 to 4:00. Typesetting and illustration.'},
  portfolio:{label:'Portfolio, then deck',cal:'Sage',what:'Thursday 1:00 to 2:30. Case study revision, then deck building from Dec 3.'},
  skills:{label:'Skills lab',cal:'Peacock',what:'Thursday 2:45 to 4:00. Figma, Blender, creative coding.'},
  studio:{label:'Open studio',cal:'Banana',what:'Friday 1:00 to 3:30. Creative brief on odd weeks, new product on even weeks.'},
  review:{label:'Weekly review',cal:'Tomato',what:'Friday 3:30 to 4:00. Count the week, show one thing to a real person.'},
  workout:{label:'Workout',cal:'Cherry Blossom',what:'Tuesday and Thursday 4:30 to 6:00, plus one flexible weekend session.'},
  setup:{label:'Sunday setup',cal:'Flamingo',what:'Sunday 5:00 to 5:20 PM. Same family as the check-in. Pick next week\'s 10 companies, glance at the calendar.'}
};
var TYPE_ORDER=['checkin','apps','nespresso','pub','portfolio','skills','studio','review','workout','setup'];

/* ---------- schedule ---------- */
var SETUP=['2026-10-25','2026-11-01','2026-11-08','2026-11-15','2026-11-22','2026-11-29'];
var A_OV={'2026-11-04':[mins(11,30),mins(14)],'2026-11-09':[mins(12,30),mins(15)],'2026-11-11':[mins(12,15),mins(14,45)],'2026-11-13':[mins(11,30),mins(14)]};
var APPT={'2026-10-26':'Appointment in the afternoon. Nespresso moves to 5:00 to 7:00 PM.','2026-11-04':'Morning appointment. Block A 11:30 to 2:00, Nespresso 3:00 to 5:00.','2026-11-09':'Appointment. Block A 12:30 to 3:00, Nespresso 3:15 to 5:15.','2026-11-11':'Appointment. Block A 12:15 to 2:45, Nespresso 3:15 to 5:15.','2026-11-13':'Appointment. Block A 11:30 to 2:00, open studio 3:00 to 4:30, review 4:30 to 5:00.'};
var ST1='Stage 1 (9:30 to 10:45): research and outreach for 2 new companies, 5 people each, half templated and half personalized. Break 10:45 to 11:00. Stage 2 (11:00 to 12:00): submit companies whose outreach is 2 or more days old, resume test first.';

function blocksBase(d){
  var k=iso(d),dow=d.getDay(),out=[];
  function B(type,title,s,e,note,proj){out.push({type:type,title:title,s:s,e:e,note:note||'',proj:proj||null,date:k});}
  if(dow===0){ if(SETUP.indexOf(k)>=0) B('setup','Sunday setup',mins(17),mins(17,20),'Pick next week\'s 10 companies from the target list and glance at the calendar.',null); return out; }

function blank(){return {done:{},left:{},notes:{},links:{},extra:{},pipeline:[],apps:{},swaps:{}};}

var mode='local',db=null,ref=null,saving=false,dirty=false,timer=null,lastJson='';
function setSaved(msg){var el=document.getElementById('saved');if(el)el.textContent=msg;}
function loadLocal(){try{var r=localStorage.getItem(LS);if(r)S=norm(JSON.parse(r));}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
function touch(){
  dirty=true;saveLocal();
  setSaved(mode==='db'?'Saving...':'Saved on this device');
  clearTimeout(timer);timer=setTimeout(flush,600);
}
function flush(){
  if(mode!=='db'||!ref){dirty=false;return;}
  if(saving){timer=setTimeout(flush,300);return;}
  saving=true;var snapshot=JSON.stringify(S);dirty=false;
  ref.set(JSON.parse(snapshot)).then(function(){saving=false;lastJson=snapshot;setSaved('Saved to your binder');if(dirty)flush();})
   .catch(function(){saving=false;mode='local';setSaved('Saved on this device only');});
}

    c.use('db').then(function(d){
      if(!d)return;db=d;ref=d.doc('term/state');mode='db';
      ref.onSnapshot(function(snap){
        if(snap.exists){
          var next=norm(snap.data());var j=JSON.stringify(next);
          if(dirty||saving||j===JSON.stringify(S)){lastJson=j;return;}
          S=next;lastJson=j;saveLocal();
          var a=document.activeElement;
          if(!(a&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT')))render();
        }else{ var hasLocal=JSON.stringify(S)!==JSON.stringify(blank()); if(hasLocal){touch();} }
        setSaved('Saved to your binder');
      },function(){mode='local';setSaved('Saved on this device only');});
    }).catch(function(){});
  }catch(e){}
}

  if(!fri&&!thu)rows.push({s:mins(16),e:mins(16,30),t:'Flex and wrap-up',d:'',cls:'plain'});

}

    html+='<div class="panel"><div class="grouph"><h3>'+(w<0?'No date':'Week '+(w+1))+'</h3>'+(w<0?'':'<span class="label">'+md(weekStart(w))+' to '+md(addDays(weekStart(w),4))+'</span>')+'</div><div class="list">'+groups[w].map(itemRow).join('')+'</div></div>';

function itemRow(it){

}

var PIPE=['Researching','Outreach sent','Applied','Follow up'];

  }
  html+='<div class="panel"><span class="label">Milestones and tasks</span><div class="list">'+(items.length?items.map(function(it){return itemRow(it)+(it.extra?'':'');}).join(''):'<div class="empty">No milestones yet.</div>')+'</div>';
  html+='<form class="form" data-form="task" data-p="'+key+'" style="margin-top:12px"><input type="text" name="t" placeholder="Add a task" aria-label="Task" required><input type="date" name="d" aria-label="Due date"><button class="btn" type="submit">Add</button></form></div>';
  html+='</div><div class="stack">';

  html+='<div class="panel"><span class="label">Where I left off'+(left.at?', '+esc(left.at):'')+'</span><textarea class="lined" id="left-'+key+'" data-note="left" data-p="'+key+'" rows="2" placeholder="Two lines for tomorrow\'s you" style="min-height:62px">'+esc(left.text)+'</textarea></div>';
  html+='<div class="panel"><span class="label">Notebook</span><textarea class="lined" id="notes-'+key+'" data-note="notes" data-p="'+key+'" rows="9" placeholder="Notes, decisions, things to try">'+esc(S.notes[key]||'')+'</textarea></div>';
  html+='<div class="panel"><span class="label">Working folder links</span><div>'+(links.length?links.map(function(l,i){return '<div class="linkrow"><a href="'+esc(l.u)+'" target="_blank" rel="noopener">'+esc(l.l||l.u)+'</a><button class="x" data-a="dellink" data-p="'+key+'" data-i="'+i+'" aria-label="Remove link">&times;</button></div>';}).join(''):'<div class="empty">Add the Figma file, folder, doc or board for this class.</div>')+'</div><form class="form" data-form="link" data-p="'+key+'" style="margin-top:10px"><input type="text" name="l" placeholder="Label" aria-label="Link label"><input type="url" name="u" placeholder="https://" aria-label="Link address" required style="flex:2 1 200px;width:auto;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;color:var(--ink)"><button class="btn" type="submit">Add</button></form></div>';

var armed=false,backupMsg='';
function viewBackup(){
  var json=JSON.stringify(S);
  return '<div class="panel"><span class="label">Your checkmarks, notes and links</span><h2>Backup</h2><p class="muted" style="margin:8px 0 14px;max-width:62ch">'+(STANDALONE?'Everything you type is saved on this device only, so a phone and a laptop do not share it. Copy a backup here and paste it into the other device to move your data across.':'Your data is saved with this page. You can still copy a backup to keep a spare.')+'</p><p style="margin-bottom:12px"><b>Last backup:</b> <span id="lastbk">'+backupAgo()+'</span>'+(STANDALONE?'<br><b>Storage protection:</b> '+(persistState==='yes'?'The browser has marked this data as permanent. Clearing site data by hand still erases it.':persistState==='no'?'The browser did not grant permanent storage, so keep your backups current.':persistState==='unsupported'?'This browser does not offer it, so keep your backups current.':'Asking the browser...'):'')+'</p><div class="row"><button class="btn" data-a="copybackup" type="button">Copy backup</button><span class="status" id="bmsg">'+esc(backupMsg)+'</span></div><textarea id="backup-out" readonly rows="4" style="margin-top:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px">'+esc(json)+'</textarea></div>'+
  '<div class="panel"><span class="label">Restore</span><h3 style="margin-bottom:8px">Paste a backup to replace what is here</h3><textarea id="backup-in" rows="4" placeholder="Paste a backup" style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px"></textarea><div class="row" style="margin-top:10px"><button class="btn ghost" data-a="restore" type="button" id="restorebtn">'+(armed?'Tap again to replace everything':'Restore')+'</button></div></div>';

/* ---------- routing and shell ---------- */
var ROUTES=[
 {k:'week',n:'This week',g:'Binder'},{k:'calendar',n:'Calendar',g:'Binder'},{k:'day',n:'Day shape',g:'Binder'},{k:'rules',n:'Rules',g:'Binder'},{k:'dates',n:'Due dates',g:'Binder'},{k:'backup',n:'Backup',g:'Binder'}
];
PROJECTS.forEach(function(p){ROUTES.push({k:p.key,n:p.name,g:'Classes',type:p.type});});
var route='week';
function readHash(){var h=(location.hash||'').replace('#','');if(!h){try{h=localStorage.getItem(LS+'-route')||'';}catch(e){}}return ROUTES.some(function(r){return r.k===h;})?h:'week';}
function renderTabs(){
  var items=allItems(),open={};items.forEach(function(it){if(!isDone(it))open[it.proj]=(open[it.proj]||0)+1;});
  var html='',g='';
  ROUTES.forEach(function(r){
    if(r.g!==g){g=r.g;html+='<span class="label grp">'+g+'</span>';}
    html+='<a href="#'+r.k+'" class="'+(r.type?'t-'+r.type+' ':'')+(r.k===route?'on':'')+'"'+(r.k===route?' aria-current="page"':'')+'>'+(r.type?'<span class="sw"></span>':'')+esc(r.n)+(r.type&&open[r.k]?'<span class="cnt">'+open[r.k]+'</span>':'')+'</a>';
  });
  document.getElementById('tabs').innerHTML=html;
}
function renderPulse(){
  var t=today(),el=document.getElementById('whereami'),txt;
  if(t<TERM_START){var n=Math.round((TERM_START-t)/864e5);txt='Term starts Monday, Oct 26, in '+n+' day'+(n===1?'':'s')+'.';}
  else if(t>TERM_END){txt='The term ended Friday, Dec 4.';}
  else{txt='Week '+(weekOf(t)+1)+' of 6. Today is '+dlong(t)+'.';}
  el.textContent=txt;
  document.getElementById('pulse').innerHTML='';
}
function render(){
  route=readHash();
  var m=document.getElementById('main');var v;
  if(route==='week')v=viewWeek();else if(route==='calendar')v=viewCalendar();else if(route==='day')v=viewDay();else if(route==='rules')v=viewRules();else if(route==='dates')v=viewDates();else if(route==='backup')v=viewBackup();else v=viewProject(route);
  m.innerHTML=backupBanner()+v;renderTabs();renderPulse();try{localStorage.setItem(LS+'-route',route);}catch(e){}
}

/* ---------- events ---------- */
function stamp(){var t=new Date();return md(t);}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;var a=el.dataset.a;
  if(a==='toggle')return;
  if(a==='week'){curWeek=+el.dataset.i;render();}
  else if(a==='goday'){curWeek=+el.dataset.i;}
  else if(a==='dow'){curDow=+el.dataset.d;render();}
  else if(a==='filter'){dueFilter=el.dataset.f;render();}
  else if(a==='app'||a==='swap'){var key=(a==='app'?'apps':'swaps'),w='w'+curWeek,max=a==='app'?30:2;var v=(S[key][w]||0)+(+el.dataset.dir);S[key][w]=Math.max(0,Math.min(max,v));touch();render();}
  else if(a==='sess'){var k=el.dataset.k;S.done[k]=!S.done[k];touch();render();}
  else if(a==='dellink'){var arr=S.links[el.dataset.p]||[];arr.splice(+el.dataset.i,1);S.links[el.dataset.p]=arr;touch();render();}
  else if(a==='pipecycle'){var r=S.pipeline[+el.dataset.i];r.s=((r.s||0)+1)%PIPE.length;touch();render();}
  else if(a==='pipedel'){S.pipeline.splice(+el.dataset.i,1);touch();render();}
  else if(a==='copybackup'){var ta=document.getElementById('backup-out'),msg=document.getElementById('bmsg');var ok=function(){markBackup();backupMsg='Copied';render();};var fb=function(){try{ta.focus();ta.select();backupMsg='Selected. Copy it from the box.';if(msg)msg.textContent=backupMsg;}catch(e){}};try{navigator.clipboard.writeText(JSON.stringify(S)).then(ok,fb);}catch(e){fb();}}
  else if(a==='restore'){var inp=document.getElementById('backup-in');var raw=inp?inp.value.trim():'';var msg2=document.getElementById('bmsg');if(!raw){backupMsg='Paste a backup first.';armed=false;render();return;}if(!armed){armed=true;render();var ta2=document.getElementById('backup-in');if(ta2)ta2.value=raw;return;}var parsed;try{parsed=JSON.parse(raw);}catch(e){armed=false;backupMsg='That is not a valid backup.';render();return;}armed=false;S=norm(parsed);backupMsg='Restored';touch();render();}
});
document.addEventListener('change',function(e){
  var el=e.target;if(!el.dataset||el.dataset.a!=='toggle')return;
  if(el.dataset.x==='1'){var arr=S.extra[el.dataset.p]||[];arr.forEach(function(x){if(x.id===el.dataset.id)x.done=el.checked;});}
  else S.done[el.dataset.id]=el.checked;
  touch();render();
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  var type=f.dataset.form,p=f.dataset.p,fd=new FormData(f);
  if(type==='task'){var t=String(fd.get('t')||'').trim();if(!t)return;(S.extra[p]=S.extra[p]||[]).push({id:'x'+uid(),t:t,d:String(fd.get('d')||''),done:false});}
  else if(type==='link'){var u=String(fd.get('u')||'').trim();if(!/^https?:\/\//i.test(u))return;(S.links[p]=S.links[p]||[]).push({l:String(fd.get('l')||'').trim(),u:u});}
  else if(type==='pipe'){var c=String(fd.get('c')||'').trim();if(!c)return;S.pipeline.unshift({id:uid(),c:c,s:0});}
  touch();render();
});
var noteTimer=null;
document.addEventListener('input',function(e){
  var el=e.target;if(!el.dataset||!el.dataset.note)return;
  var p=el.dataset.p;
  if(el.dataset.note==='left')S.left[p]={text:el.value,at:stamp()};
  else S.notes[p]=el.value;
  clearTimeout(noteTimer);noteTimer=setTimeout(touch,500);
});
window.addEventListener('hashchange',render);

initStore();
askPersist();
render();
})();
